# Mini-project 01: a hardened, monitored web service
# Each security setting is explained in README.md, section 3.
services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # runs nginx as a non-root user (uid 101)
    container_name: secure-web
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"            # listen only on the address we choose
    read_only: true                                  # the container can't change its own files
    tmpfs:
      - /tmp                                         # the one writable place nginx needs (pid, cache)
    cap_drop:
      - ALL                                          # no Linux capabilities at all
    security_opt:
      - no-new-privileges:true                       # processes can never gain more privileges
    mem_limit: 128m                                  # resource limits stop one container starving the host
    pids_limit: 100
    volumes:
      - ./site:/usr/share/nginx/html:ro              # website files, read-only
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LOG_DIR:-./logs}:/var/log/nginx            # access/error logs land on the host for Wazuh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
