server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;                                   # don't advertise the nginx version

    # Security headers: tell browsers to block common attacks
    add_header X-Content-Type-Options "nosniff" always;  # don't guess file types
    add_header X-Frame-Options "DENY" always;            # can't be put in a frame (clickjacking)
    add_header Referrer-Policy "no-referrer" always;     # don't leak URLs to other sites
    add_header Content-Security-Policy "default-src 'self'" always;  # only load our own content

    # Only allow the methods a static site needs
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /health { access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
