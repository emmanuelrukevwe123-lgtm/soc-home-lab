# Extension E1: a hardened, monitored web service
# Each security setting is explained in README.md, section 3.
services:
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # runs nginx as a non-root user (uid 101)
    container_name: secure-web
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:8080"            # HTTP: health check + redirect to HTTPS
      - "${BIND_IP:-127.0.0.1}:8443:8443"            # HTTPS: the site
    read_only: true                                  # the container can't change its own files
    tmpfs:
      - /tmp                                         # the one writable place nginx needs (in RAM)
    cap_drop:
      - ALL                                          # no Linux capabilities at all
    security_opt:
      - no-new-privileges:true                       # processes can never gain more privileges
    mem_limit: 128m                                  # resource limits protect the host
    pids_limit: 100
    volumes:
      - ./site:/usr/share/nginx/html:ro              # website files, read-only
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro                      # certificate + private key (never committed)
      - ./auth:/etc/nginx/auth:ro                    # hashed admin password (never committed)
      - ${LOG_DIR:-./logs}:/var/log/nginx            # logs on the host, for Wazuh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
