# Port 8080 (HTTP): only the health check; everything else is redirected to HTTPS.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    location = /health { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host:8443$request_uri; }
}

# Port 8443 (HTTPS): the real site.
server {
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                                   # don't advertise the nginx version

    ssl_certificate     /etc/nginx/tls/server.crt;       # signed by our own lab CA
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;                       # no old, broken protocol versions

    # Security headers: tell browsers to block common attacks
    add_header Strict-Transport-Security "max-age=31536000" always;  # always use HTTPS from now on
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; } # a static site needs nothing else

    location /admin/ {                                   # zero trust: even LAN users must log in
        auth_basic "Admin area";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        try_files $uri $uri/ =404;
    }
    location / { try_files $uri $uri/ =404; }
}
