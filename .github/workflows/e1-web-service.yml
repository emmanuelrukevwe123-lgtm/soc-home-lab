# CI for extension E1: lint the scripts, deploy the container, prove the hardening.
name: e1 hardened web service
on:
  push:
    paths: ["mini-projects/e1-hardened-web-service/**", ".github/workflows/e1-web-service.yml"]
  pull_request:
    paths: ["mini-projects/e1-hardened-web-service/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-test-password-not-a-secret   # throwaway login, only for this test container
    defaults:
      run:
        working-directory: mini-projects/e1-hardened-web-service
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        run: shellcheck -S warning *.sh
      - name: Validate compose file
        run: docker compose config -q
      - name: Create lab CA, certificate and admin login
        run: ./make-certs.sh && ./make-user.sh
      - name: Deploy
        run: ./deploy.sh
      - name: Security checks
        run: ./check.sh
      - name: Show container logs on failure
        if: failure()
        run: docker logs secure-web || true
      - name: Clean up
        if: always()
        run: docker compose down
